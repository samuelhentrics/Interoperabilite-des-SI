<div class="container my-3">
  <h3>Ajouter une demande</h3>

  <form (ngSubmit)="submit()" #form="ngForm">

    <div class="mb-3">
  <label for="type" class="form-label">Type de panne *</label>
  <input id="type" name="fault_type" class="form-control" [(ngModel)]="type_panne" required />
    </div>

    <div class="mb-3">
      <label for="commentaire" class="form-label">Commentaire</label>
      <textarea id="commentaire" name="commentaire" class="form-control" [(ngModel)]="comment_panne"></textarea>
    </div>

    <!-- Choix client -->
    <div class="mb-3">
      <label for="client_name" class="form-label">Client *</label>
      <select id="client_name" name="client_name" class="form-select" [(ngModel)]="client_name" required>
        <option *ngFor="let client of clients" [value]="client.id">{{ client.name }}</option>
      </select>
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="submitting">Créer</button>
    <a routerLink="/demandes" class="btn btn-secondary ms-2">Annuler</a>
  </form>
</div>
